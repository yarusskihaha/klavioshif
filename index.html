<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta charset="UTF-8">
<title>Клавиошиф</title>

<style>
  body {
    background: #0b0b0b;
    color: #00ff88;
    font-family: monospace;
    text-align: center;
    padding: 20px;
  }

  textarea {
    width: 90%;
    height: 120px;
    background: black;
    color: #00ff88;
    border: 2px solid #00ff88;
    font-size: 16px;
  }

  input, button {
    margin: 5px;
    font-size: 16px;
  }

  button {
    background: black;
    color: #00ff88;
    border: 2px solid #00ff88;
    cursor: pointer;
  }

  button:hover {
    background: #00ff88;
    color: black;
  }
</style>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🏅 КЛАВИОШИФ</h1>
<p>Сдвиг по клавиатуре</p>

<textarea id="text" placeholder="Введи текст"></textarea><br>

Сдвиг:
<input type="number" id="shift" value="1">

<br>

<button onclick="encrypt()">Зашифровать</button>
<button onclick="decrypt()">Расшифровать</button>
// Gemini new script
<script>
// Объект со всеми раскладками (база данных шифра)
const layouts = {
    ru: "йцукенгшщзхъфывапролджэячсмитьбю",
    en: "qwertyuiopasdfghjklzxcvbnm",
    jp: "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん"
};

function processText(direction) {
    let textarea = document.getElementById("text");
    let original = textarea.value;
    let shift = Number(document.getElementById("shift").value) * direction;
    let result = "";

    for (let char of original) {
        let lower = char.toLowerCase();
        let found = false;

        // Проверяем каждую раскладку по очереди (комбинирование)
        for (let lang in layouts) {
            let keyboard = layouts[lang];
            let index = keyboard.indexOf(lower);

            if (index !== -1) {
                // Вычисляем новый индекс с учетом длины конкретной раскладки
                let newIndex = (index + shift) % keyboard.length;
                if (newIndex < 0) newIndex += keyboard.length;

                let newChar = keyboard[newIndex];
                // Сохраняем регистр (большая/маленькая буква)
                result += char === char.toUpperCase() ? newChar.toUpperCase() : newChar;
                found = true;
                break; // Буква найдена, переходим к следующему символу
            }
        }

        // Если символ не найден ни в одной раскладке (пробел, цифра, смайл)
        if (!found) {
            result += char;
        }
    }

    textarea.value = result;
    console.log(direction === 1 ? "Зашифровано" : "Расшифровано");
}

function encrypt() { processText(1); }
function decrypt() { processText(-1); }
</script>

  <script src="script.js"></script>
</body>
</html>
